[project]
name = "repo-to-wiki-backend"
version = "0.1.0"
description = "Repo-to-wiki backend: ingestion, wiki generation, chat agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
    "gitpython>=3.1.40",
    "networkx>=3.0",
    # nx.pagerank() in ingestion/code_graph.py::rank_important_symbols needs scipy
    "scipy>=1.10.0",
    "tree-sitter>=0.22.0",
    # src/ingestion/ts_parser.py prefers tree-sitter-language-pack (grammars built
    # for current tree-sitter ABI versions) and only falls back to the older
    # tree-sitter-languages, whose bundled grammar binaries target ABI version 14
    # and make every parser.parse() call raise "ValueError: Parsing failed" against
    # tree-sitter>=0.22 (caught per-file by the caller, so code chunking silently
    # produces zero chunks instead of erroring loudly). Without this package
    # installed, ts_parser.py always falls through to the broken fallback.
    "tree-sitter-language-pack>=0.2.0",
    "tree-sitter-languages>=1.10.2",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.0.1",
    "langchain-openai>=0.0.5",
    "langchain-openrouter>=0.0.1",
    "langgraph>=0.2.0",
    "qdrant-client>=1.10.0",
    "fastembed>=0.3.0",
    "supabase>=2.3.0",
    "duckduckgo-search>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]
# Docstrings are optional; only lint the format of ones that exist.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
